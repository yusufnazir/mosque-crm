# Application
spring.application.name=mosque-crm-backend

# DataSource
spring.datasource.url=jdbc:mariadb://localhost:3307/mcrm?createDatabaseIfNotExist=true&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&nullCatalogMeansCurrent=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=mcrm
spring.datasource.password=mcrm

# HikariCP — recover stale connections after idle/sleep (dev laptop) or network blips (prod)
# max-lifetime must stay below MariaDB wait_timeout (often 28800s)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
# CRITICAL: Must be true — TenantInterceptor depends on EntityManager being
# available throughout the request lifecycle to enable the organizationFilter.
spring.jpa.open-in-view=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# FreeMarker
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.charset=UTF-8
spring.freemarker.cache=false

# Spring Security (default user)
spring.security.user.name=admin
spring.security.user.password=admin123

# Server
server.port=8200
server.servlet.context-path=/api

# JWT Configuration
# CRITICAL: In production, set JWT_SECRET environment variable to a cryptographically random 256-bit string
# Generate with: openssl rand -base64 32
# DO NOT commit production secrets to source control!
jwt.secret=${JWT_SECRET:mosque-crm-dev-secret-CHANGE-THIS-IN-PRODUCTION-use-openssl-rand-base64-32-to-generate}
# Token expiration: 86400000ms = 24 hours
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
# Production: Set to your actual frontend domain (e.g., https://app.mosque.com)
# Development: http://localhost:3000
# Multiple origins: comma-separated list
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3002,http://localhost:3000,http://localhost:19006}

# MinIO / S3-compatible Object Storage
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:9000}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:minioadmin}
storage.s3.bucket=${STORAGE_S3_BUCKET:mosque-crm}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}

# Profile image constraints
storage.profile-image.max-size-mb=${STORAGE_PROFILE_IMAGE_MAX_SIZE_MB:5}
storage.profile-image.allowed-types=image/jpeg,image/png,image/webp,image/gif

# Multipart upload limits (business gallery images are capped at 5 MB each and the
# default Spring limit of 1 MB would reject every real photo before our own check runs).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:30MB}

# ─── WhatsApp (WAHA) ───────────────────────────────────────────────────────────
# One shared WhatsApp session for the whole installation.
waha.base-url=${WAHA_BASE_URL:http://localhost:3000}
waha.api-key=${WAHA_API_KEY:}
waha.session=${WAHA_SESSION:default}
# Shared secret WAHA must send on the inbound webhook (X-Webhook-Token header or ?token= query).
# Leave empty to keep the webhook disabled (it answers 503 instead of accepting unauthenticated events).
waha.webhook-secret=${WAHA_WEBHOOK_SECRET:}

# Anti-ban pacing (all overridable per deployment)
waha.worker-poll-millis=${WAHA_WORKER_POLL_MILLIS:5000}
waha.cold-delay-min-seconds=${WAHA_COLD_DELAY_MIN_SECONDS:15}
waha.cold-delay-max-seconds=${WAHA_COLD_DELAY_MAX_SECONDS:45}
waha.conversation-delay-min-seconds=${WAHA_CONVERSATION_DELAY_MIN_SECONDS:5}
waha.conversation-delay-max-seconds=${WAHA_CONVERSATION_DELAY_MAX_SECONDS:15}
waha.typing-min-seconds=${WAHA_TYPING_MIN_SECONDS:2}
waha.typing-max-seconds=${WAHA_TYPING_MAX_SECONDS:4}

# Hard caps for the number
waha.max-per-hour=${WAHA_MAX_PER_HOUR:20}
waha.max-per-day=${WAHA_MAX_PER_DAY:100}
waha.warmup-start-per-day=${WAHA_WARMUP_START_PER_DAY:20}
waha.warmup-step-per-day=${WAHA_WARMUP_STEP_PER_DAY:20}
waha.max-attempts=${WAHA_MAX_ATTEMPTS:3}

# Quiet hours (local time in waha.timezone): nothing is sent between start (inclusive) and end (exclusive)
waha.quiet-hours-start=${WAHA_QUIET_HOURS_START:20}
waha.quiet-hours-end=${WAHA_QUIET_HOURS_END:9}
waha.timezone=${WAHA_TIMEZONE:Europe/Amsterdam}

# A reply within this window switches the contact to the shorter "conversation" delay
waha.conversation-window-hours=${WAHA_CONVERSATION_WINDOW_HOURS:24}

# Country calling code (digits only) used for phone numbers stored in national format (e.g. 0612345678)
waha.default-country-code=${WAHA_DEFAULT_COUNTRY_CODE:31}

waha.connect-timeout-millis=${WAHA_CONNECT_TIMEOUT_MILLIS:5000}
waha.read-timeout-millis=${WAHA_READ_TIMEOUT_MILLIS:20000}

# ─── Platform schedulers ───────────────────────────────────────────────────────
# Every background job is registered in the Schedulers view (platform admin) and can be
# started, stopped, re-timed and run on demand at runtime — no restart needed.
# Set SCHEDULER_ENABLED=false to boot with every job stopped (useful for tests/tools).
scheduler.enabled=${SCHEDULER_ENABLED:true}
scheduler.pool-size=${SCHEDULER_POOL_SIZE:4}

